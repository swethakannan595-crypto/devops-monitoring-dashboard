# Global configuration
global:
  scrape_interval: 5s
  evaluation_interval: 15s


# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093


# Rule files
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"


# Scrape configurations
scrape_configs:

  # Prometheus itself
  - job_name: "prometheus"

    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"


  # FastAPI DevOps Monitoring Dashboard
  - job_name: "fastapi-dashboard"

    metrics_path: "/metrics"

    static_configs:
      - targets: ["localhost:8000"]
        labels:
          app: "devops-monitor-dashboard"